name: Sprite animati
# Converte le animazioni dei Pokémon di Showdown in WebP senza perdita (cartella ani/).
# Parte da solo quando si carica converti.py o questo file, e ogni 2 anni (lo avvia il flusso
# «Sprite animati ogni 2 anni» della repo VGCrAKings). A mano: Actions -> Sprite animati -> Run workflow. Converte solo quelli che mancano. Nessuna chiave segreta.
on:
  push:
    branches: [main]
    paths: ["converti.py", ".github/workflows/sprite.yml"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sprite
  cancel-in-progress: false
jobs:
  converti:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pillow
      - run: python -u converti.py
      - name: Salva su GitHub (solo se cambiato)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ani elenco.json
          if git diff --cached --quiet; then echo "Niente di nuovo"; exit 0; fi
          git commit -q -m "Sprite animati: aggiornamento"
          git push
